<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Clientes</title></head>
<body>
<h1>Clientes</h1>

<form th:action="@{/clientes}" method="get">
  <input type="text" name="q" th:value="${q}" placeholder="Buscar por nome">
  <button type="submit">Buscar</button>
  <a th:href="@{/clientes/novo}">Novo</a>
</form>

<table border="1" cellpadding="6">
  <tr><th>ID</th><th>Nome</th><th>CPF</th><th>E-mail</th><th>Telefone</th><th>Ações</th></tr>
  <tr th:each="c : ${clientes}">
    <td th:text="${c.id}"></td>
    <td th:text="${c.nome}"></td>
    <td th:text="${c.cpf}"></td>
    <td th:text="${c.email}"></td>
    <td th:text="${c.telefone}"></td>
    <td>
      <a th:href="@{|/clientes/${c.id}/editar|}">Editar</a>
      <form th:action="@{|/clientes/${c.id}/excluir|}" method="post" style="display:inline">
        <!-- CSRF obrigatório em POST -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" onclick="return confirm('Excluir?')">Excluir</button>
      </form>
    </td>
  </tr>
</table>

</body>
</html>
