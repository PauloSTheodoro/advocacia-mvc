<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cliente</title></head>
<body>
<h1 th:text="${cliente.id == null ? 'Novo Cliente' : 'Editar Cliente'}"></h1>

<div th:if="${erro}" style="color:red" th:text="${erro}"></div>

<form th:action="${cliente.id == null} ? @{/clientes} : @{|/clientes/${cliente.id}|}"
      method="post" th:object="${cliente}">
  <!-- CSRF -->
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

  <label>Nome: <input type="text" th:field="*{nome}"></label>
  <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color:red"></div>

  <label>CPF: <input type="text" th:field="*{cpf}" placeholder="Somente dígitos"></label>
  <div th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" style="color:red"></div>

  <label>Telefone: <input type="text" th:field="*{telefone}"></label>
  <div th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" style="color:red"></div>

  <label>E-mail: <input type="email" th:field="*{email}"></label>
  <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red"></div>

  <label>Data de Nascimento: <input type="date" th:field="*{dataNascimento}"></label>
  <div th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}" style="color:red"></div>

  <label>Endereço: <input type="text" th:field="*{endereco}"></label>

  <label>Observações:<br><textarea th:field="*{observacoes}" rows="4"></textarea></label>

  <button type="submit">Salvar</button>
  <a th:href="@{/clientes}">Voltar</a>
</form>
</body>
</html>
